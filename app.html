<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIJOB - Local Inclusive Job Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>ALIJOB</h1>
      <p>A local inclusive job board</p>
    </header>

    <main>
      <h2>Available Jobs</h2>
      <div class="controls">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="all">All</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Babysitting">Babysitting</option>
          <option value="Gardening">Gardening</option>
          <option value="Dry Cleaning">Dry Cleaning</option>
          <option value="Handy Man">Handy Man</option>
        </select>

        <label for="search-input">Search</label>
        <input type="text" id="search-input" placeholder="Type a keyword" />
      </div>
      <section class="job-grid">
        <section class="post-job" aria-labelledby="post-heading">
  <h2 id="post-heading">Post a Job</h2>

  <form id="post-form" novalidate>
    <label for="post-title">Title</label>
    <input type="text" id="post-title" />

    <label for="post-category">Category</label>
    <select id="post-category">
      <option value="">Choose a category</option>
      <option value="Cleaning">Cleaning</option>
      <option value="Babysitting">Babysitting</option>
      <option value="Gardening">Gardening</option>
      <option value="Dry Cleaning">Dry Cleaning</option>
      <option value="Handy Man">Handy Man</option>
    </select>

    <label for="post-location">Location</label>
    <input type="text" id="post-location" />

    <label for="post-pay">Pay (₱)</label>
    <input type="number" id="post-pay" min="0" />

    <label for="post-description">Description</label>
    <textarea id="post-description" rows="4"></textarea>

    <button type="submit">Post Job</button>
    <p id="post-message" aria-live="polite"></p>
  </form>
</section>
      </section>
    </main>
    <dialog id="job-popup" aria-labelledby="popup-title">
      <h2 id="popup-title"></h2>
      <p id="popup-description"></p>
      <p id="popup-location"></p>
      <p id="popup-pay"></p>
      <h2 id="popup-title"></h2>
      <p id="popup-category"></p>

      <button type="button" id="popup-close">Close</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
